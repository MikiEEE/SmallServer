[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smallserver"
version = "0.1.0"
description = "A SmallOS-native HTTP/1.1 and HTTP/2 web framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Michael E" }]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2"]
http2 = ["h2>=4,<5"]

[tool.setuptools.packages.find]
include = ["smallserver*"]

[tool.setuptools.package-data]
smallserver = ["py.typed"]
